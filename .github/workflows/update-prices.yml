name: Update reference prices

# Weekly: read the latest NERC tariff orders and open a pull request with any
# changed prices, so a person checks them before the app uses them.
on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OCR and Python packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tesseract-ocr
          pip install -r requirements-dev.txt

      - name: Read NERC orders
        run: python scripts/update_prices.py --summary price-summary.md

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/prices.json; then
            echo "No price changes."
            exit 0
          fi
          branch="automated/price-update"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add data/prices.json
          git commit -m "Update reference prices from NERC orders"
          git push --force origin "$branch"
          if gh pr view "$branch" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$branch" --body-file price-summary.md
          else
            gh pr create --head "$branch" --base "${{ github.event.repository.default_branch }}" \
              --title "Update reference prices from NERC orders" --body-file price-summary.md
          fi
